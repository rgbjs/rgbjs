[package]
name = "rgbjs-v011"
version = "0.0.1"
edition = "2021"
publish = false
description = "wasm bindings for RGB v0.11 (rgb-protocol crates), used by the rgbjs npm package"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rgb-invoicing = "=0.11.1"
rgb-ops = "=0.11.1"
rgb-schemas = "=0.11.1"
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
