[package]
name = "rgbjs-v011"
version = "0.0.1"
edition = "2021"
publish = false
description = "wasm bindings for RGB v0.11 (rgb-protocol crates), used by the rgbjs npm package"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rgb-invoicing = "=0.11.1"
rgb-ops = "=0.11.1"
rgb-schemas = "=0.11.1"
rgb-strict-encoding = "=1.0.5"
serde_json = "1"
wasm-bindgen = "0.2"
# Not used directly: turns on `lowmemory` for the two secp256k1 copies that
# rgb-consensus pulls in, shrinking their precomputed tables in the wasm.
secp256k1-sys-010 = { package = "secp256k1-sys", version = "=0.10.1", features = ["lowmemory"] }
secp256k1-sys-014 = { package = "secp256k1-sys", version = "=0.14.1", features = ["lowmemory"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
