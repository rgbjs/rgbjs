[package]
name = "rgbjs-v012"
version = "0.0.1"
edition = "2021"
publish = false
description = "wasm bindings for RGB v0.12 (RGB-WG crates), used by the rgbjs npm package"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rgb-invoice = { version = "=0.12.0-rc.3", features = ["uri"] }
hypersonic = "0.12.0"
sonic-callreq = "0.12.0"
serde_json = "1"
strict_types = "2.9.1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
