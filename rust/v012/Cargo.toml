[package]
name = "rgbjs-v012"
version = "0.0.1"
edition = "2021"
publish = false
description = "wasm bindings for RGB v0.12 (RGB-WG crates), used by the rgbjs npm package"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rgb-invoice = { version = "=0.12.0-rc.3", features = ["uri"] }
hypersonic = "0.12.0"
rgb-std = { version = "=0.12.0-rc.3", features = ["serde"] }
commit_verify = "0.12.0"
bp-core = "0.12.0"
amplify = "4"
strict_encoding = "2"
sonic-callreq = "0.12.0"
serde_json = "1"
strict_types = "2.9.1"
wasm-bindgen = "0.2"
rgb-runtime = { version = "=0.12.0-rc.3", default-features = false, features = ["std"] }
bp-std = { version = "=0.12.0-rc.3", features = ["client-side-validation"] }
serde = { version = "1", features = ["derive"] }
# Not used directly: turns on `lowmemory` for secp256k1, shrinking its
# precomputed tables in the wasm.
secp256k1-sys = { version = "=0.10.1", features = ["lowmemory"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
# Caps decoder pre-allocation; see rust/patches/strict_encoding-2.9.1/RGBJS-PATCH.md.
strict_encoding = { path = "../patches/strict_encoding-2.9.1" }
# Caps value-decoder pre-allocation; see rust/patches/strict_types-2.9.1/RGBJS-PATCH.md.
strict_types = { path = "../patches/strict_types-2.9.1" }
